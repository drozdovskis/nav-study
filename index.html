<!doctype html><html><head><meta charset=utf8><meta name="robots" content="noindex,nofollow"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>D&amp;A Hub Navigation Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f4f4f6; --surface:#ffffff; --surface-2:#eeeef1; --ink:#141416; --ink-2:#4a4a52; --ink-3:#73737c;
  --line:#dcdce1; --line-2:#c5c5cc;
  --a:#6b2fa3; --a-soft:#f0e7f8; --a-ink:#55238a;
  --b:#d6006a; --b-soft:#fde7f1; --b-ink:#a3004f;
  --pink:#fd0074; --grad:linear-gradient(120deg,#fd005a 0%,#fd0074 45%,#8e1fa6 100%);
  --ok:#2e7d4f; --ok-soft:#e3f2e8; --bad:#c0392b; --bad-soft:#f9e3e0; --warn:#9a6410; --warn-soft:#f7ecd8;
  --focus:#2563eb; --shadow:0 12px 32px rgba(20,20,30,.16);
  --ui:"Barlow", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --display:"Barlow Condensed", "Arial Narrow", "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --sp:"Segoe UI","Segoe UI Web (West European)",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121214; --surface:#1b1b1f; --surface-2:#25252b; --ink:#ececf0; --ink-2:#b2b2bb; --ink-3:#8b8b95;
    --line:#2f2f36; --line-2:#3f3f47;
    --a:#b68ce2; --a-soft:#2a2037; --a-ink:#d4b8f1;
    --b:#ff5aa6; --b-soft:#3b1a2b; --b-ink:#ff9bc8;
    --ok:#62bb86; --ok-soft:#1b3326; --bad:#e8847a; --bad-soft:#3a1f1d; --warn:#d9a24a; --warn-soft:#3a2d15;
    --focus:#7aa7ff; --shadow:0 12px 32px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#121214; --surface:#1b1b1f; --surface-2:#25252b; --ink:#ececf0; --ink-2:#b2b2bb; --ink-3:#8b8b95;
  --line:#2f2f36; --line-2:#3f3f47;
  --a:#b68ce2; --a-soft:#2a2037; --a-ink:#d4b8f1;
  --b:#ff5aa6; --b-soft:#3b1a2b; --b-ink:#ff9bc8;
  --ok:#62bb86; --ok-soft:#1b3326; --bad:#e8847a; --bad-soft:#3a1f1d; --warn:#d9a24a; --warn-soft:#3a2d15;
  --focus:#7aa7ff; --shadow:0 12px 32px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--ui);font-size:15.5px;line-height:1.5;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
a{color:inherit}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Study shell ---------- */
.shell{max-width:1240px;margin:0 auto;padding-inline:clamp(16px,3vw,32px);padding-block:20px 64px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:4px 18px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:.01em}
.brand-mark{width:28px;height:28px;border-radius:6px;background:var(--grad)}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:1px solid transparent;background:none;padding:6px 12px;border-radius:6px;color:var(--ink-2);text-decoration:none;font-weight:500}
.tab[aria-current="page"]{background:var(--surface);border-color:var(--line);color:var(--ink)}
.tab:hover{color:var(--ink)}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
h1.title{font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:clamp(34px,5vw,54px);line-height:.95;letter-spacing:.005em;margin:8px 0 12px;text-wrap:balance}
.lede{color:var(--ink-2);max-width:68ch;margin:0}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;padding-block:28px 24px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--surface);padding:8px 14px;border-radius:6px;font-weight:600;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--pink);color:#fff;border-color:var(--pink)}
.btn.primary:hover{filter:brightness(.95)}
.btn.va{border-color:var(--a);color:var(--a-ink);background:var(--a-soft)}
.btn.vb{border-color:var(--b);color:var(--b-ink);background:var(--b-soft)}
.btn.ghost{background:none;border-color:transparent;color:var(--ink-2)}
.btn.sm{padding:4px 10px;font-size:13.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.section{padding-block:28px;border-top:1px solid var(--line)}
.section-h{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.section-h h2{font-size:21px;letter-spacing:-.005em;margin:0;font-weight:700}
.section-h p{margin:0;color:var(--ink-2);font-size:14px}
.stats{display:flex;gap:28px;flex-wrap:wrap;margin-top:18px}
.stat b{display:block;font-family:var(--display);font-size:30px;font-weight:700;line-height:1}
.stat span{font-size:13px;color:var(--ink-3)}
.taskbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.taskbar .lbl{font-size:13px;color:var(--ink-3);margin-right:4px}
.tchip{font-family:var(--mono);font-size:13px;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:3px 11px}
.tchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.taskline{min-height:24px;color:var(--ink-2);font-size:14px;margin:0 0 16px;max-width:92ch}
.taskline b{color:var(--ink)}
.trees{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:860px){.trees{grid-template-columns:1fr}}
.tree{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tree-h{padding:16px 18px 14px;border-bottom:1px solid var(--line);display:grid;gap:4px}
.tree-h .vtag{font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.04em}
.tree.va .vtag{color:var(--a)} .tree.vb .vtag{color:var(--b)}
.tree.va .tree-h{border-top:4px solid var(--a)} .tree.vb .tree-h{border-top:4px solid var(--b)}
.tree-h h3{margin:0;font-family:var(--display);text-transform:uppercase;font-size:24px;letter-spacing:.01em}
.tree-h p{margin:0;font-size:13.5px;color:var(--ink-2)}
.tree-h .meta{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.tree ol{list-style:none;margin:0;padding:6px 0}
.tl{padding:10px 18px;display:grid;grid-template-columns:minmax(0,175px) 1fr;gap:6px 14px;border-top:1px solid var(--surface-2)}
.tl:first-child{border-top:0}
.tl-label{font-weight:600;font-size:14.5px;padding-top:3px}
.tl-body{display:flex;flex-direction:column;gap:6px;min-width:0}
.grp{display:flex;flex-direction:column;gap:4px}
.grp-task{font-size:13px;color:var(--ink-2);font-style:italic}
.pgs{display:flex;flex-wrap:wrap;gap:5px}
@media (max-width:520px){.tl{grid-template-columns:1fr}}
.pg{font-size:13px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:5px;padding:2px 9px;text-align:left;line-height:1.45}
.pg:hover{border-color:var(--ink-3)}
.pg .dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:6px;vertical-align:1px;background:var(--ink-3)}
.pg .dot.new{background:var(--warn)} .pg .dot.tbc{background:transparent;border:1.5px solid var(--warn)} .pg .dot.live{background:var(--ok)}
.pg.shortcut{border-style:dashed}
.pg.is-exp{background:var(--warn-soft);border-color:var(--warn)}
.tree.va .pg.is-sel{background:var(--a);border-color:var(--a);color:#fff}
.tree.vb .pg.is-sel{background:var(--b);border-color:var(--b);color:#fff}
.pg.is-sel .dot{background:#fff;border-color:#fff}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .dot{display:inline-block;width:7px;height:7px;border-radius:50%}
.detail{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr);gap:18px}
@media (max-width:860px){.detail{grid-template-columns:1fr}}
.detail h4{margin:0 0 4px;font-size:16px}
.detail .k{font-size:12px;color:var(--ink-3);font-family:var(--mono);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.detail .path{font-size:14px}
.detail .path.a b{color:var(--a-ink)} .detail .path.b b{color:var(--b-ink)}
.detail.empty{display:block;color:var(--ink-3);font-size:14px}
.status{display:inline-block;font-size:12px;font-weight:600;border-radius:4px;padding:1px 7px;margin-right:6px}
.status.live{background:var(--ok-soft);color:var(--ok)} .status.new,.status.tbc{background:var(--warn-soft);color:var(--warn)}
.ext{font-size:13.5px;word-break:break-all}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-size:12px;font-weight:500;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;font-family:var(--mono);background:var(--surface-2)}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tid{font-family:var(--mono);font-weight:500}
.newtag{font-family:var(--mono);font-size:11px;color:var(--warn);margin-left:6px}
.exp-list{display:flex;flex-wrap:wrap;gap:4px}
.exp-list span{font-size:12.5px;background:var(--surface-2);border-radius:4px;padding:1px 7px;white-space:nowrap}
.evid{font-size:12.5px;color:var(--ink-3);margin-top:4px}
th.ga{color:var(--a)} th.gb{color:var(--b)}
.meter{display:flex;align-items:center;gap:8px}
.meter i{display:block;height:6px;border-radius:3px;background:var(--surface-2);width:64px;position:relative;overflow:hidden}
.meter i s{position:absolute;inset:0 auto 0 0;background:var(--ok);text-decoration:none}
.empty-note{padding:18px;color:var(--ink-3);font-size:14px}
.filters{display:flex;gap:10px 18px;flex-wrap:wrap;align-items:center;font-size:13.5px;color:var(--ink-2)}
.filters label{display:inline-flex;gap:6px;align-items:center}
.filters select{border:1px solid var(--line-2);background:var(--surface);border-radius:6px;padding:3px 6px}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.rule{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;font-size:14px;color:var(--ink-2)}
.rule b{display:block;color:var(--ink);margin-bottom:2px;font-size:14.5px}
.console{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:24px;padding-block:24px}
@media (max-width:900px){.console{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px}
.panel h2{font-size:18px;margin:0 0 14px}
.field{display:grid;gap:6px;margin-bottom:16px}
.field > .flabel,.flabel{font-size:13px;font-weight:600}
.field .hint,.hint{font-size:12.5px;color:var(--ink-3)}
.field input[type=text],.field input[type=password],.field select,textarea{border:1px solid var(--line-2);background:var(--surface);border-radius:6px;padding:8px 10px;width:100%}
.opts{display:grid;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:14px}
.opt:has(input:checked){border-color:var(--ink-3);background:var(--surface-2)}
.opt input{margin-top:4px}
.opt small{display:block;color:var(--ink-3);font-size:12.5px}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.checks label{display:flex;gap:6px;align-items:center;font-family:var(--mono);font-size:13px;border:1px solid var(--line);border-radius:6px;padding:5px 8px}
.inline-checks{display:flex;gap:16px;flex-wrap:wrap;font-size:14px}
.inline-checks label{display:flex;gap:6px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg label{padding:6px 12px;font-size:14px;border-left:1px solid var(--line-2);display:flex;gap:6px;align-items:center}
.seg label:first-child{border-left:0}
.seg label:has(input:checked){background:var(--ink);color:var(--bg)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:focus-visible){outline:2px solid var(--focus);outline-offset:-2px}
.slist{display:grid;gap:8px}
.srow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--surface)}
.srow .who{font-family:var(--mono);font-weight:500}
.srow .sub{font-size:13px;color:var(--ink-3)}
.pill{font-size:12px;border-radius:999px;padding:1px 8px;font-weight:600;white-space:nowrap}
.pill.a{background:var(--a-soft);color:var(--a-ink)} .pill.b{background:var(--b-soft);color:var(--b-ink)}
.pill.pilot{background:var(--warn-soft);color:var(--warn)} .pill.open{background:var(--surface-2);color:var(--ink-2)}
.endbox{display:inline-flex;gap:6px;align-items:center;font-size:13px}
.dbnote{font-size:13px;color:var(--ink-3);margin-top:10px}

/* ---------- Facilitator bar ---------- */
.fbar{position:sticky;top:0;z-index:40;background:#141416;color:#ececf0;display:flex;gap:10px 16px;align-items:center;flex-wrap:wrap;padding:8px 16px;font-size:13.5px}
.fbar .vt{font-family:var(--mono);font-size:12.5px;padding:2px 8px;border-radius:4px;color:#fff}
.fbar .vt.a{background:#6b2fa3} .fbar .vt.b{background:#d6006a}
.fbar .sp{flex:1}
.fbar button,.fbar a{background:transparent;border:1px solid #3f3f47;color:#ececf0;border-radius:6px;padding:3px 10px;text-decoration:none;font-size:13px}
.fbar button:hover,.fbar a:hover{border-color:#8b8b95}
.fbar .wsel{display:inline-flex;gap:2px;align-items:center}
.fbar .wsel span{color:#8b8b95;margin-right:6px}
.fbar .wsel button{border-color:transparent;font-family:var(--mono);font-size:12px;padding:3px 7px}
.fbar .wsel button[aria-pressed="true"]{background:#ececf0;color:#141416}

/* ---------- Mock D&A Hub in Reckitt intranet style (fixed light, mirrors the live site) ---------- */
.stage{background:var(--bg);min-height:100vh}
.stage.framed{padding:16px}
.wlabel{font-family:var(--mono);font-size:12px;color:var(--ink-3);text-align:center;margin-bottom:6px}
.site{--p:#fd0074;--p-dark:#d4005f;--ink:#242424;--ink-2:#616161;--line:#e1e1e1;--band:#f5f5f5;
  font-family:var(--sp);color:var(--ink);background:#fff;margin:0 auto;min-height:100vh;position:relative;font-size:14px;color-scheme:light}
.stage.framed .site{min-height:calc(100vh - 60px);box-shadow:0 0 0 1px #d0d0d6,0 8px 28px rgba(0,0,0,.12)}
.suite{height:44px;background:#e6007e;color:#fff;display:flex;align-items:center;gap:14px;padding:0 12px}
.suite .sp-word{font-weight:600;font-size:15px;white-space:nowrap}
.hubnav{display:flex;gap:22px;align-items:center;padding:10px 24px;border-bottom:1px solid var(--line);font-size:14px;color:var(--ink);overflow:hidden;white-space:nowrap}
.hubnav button{background:none;border:0;padding:0;font-size:14px;color:var(--ink)}
.hubnav button:hover{color:var(--p)}
.site-body{display:flex;align-items:stretch;min-height:0}
.rail{width:58px;flex:none;border-right:1px solid var(--line);background:#fff;display:flex;flex-direction:column;align-items:center;gap:16px;padding:10px 0;color:var(--ink-2)}
.rail span{display:grid;gap:3px;justify-items:center;font-size:9.5px;line-height:1.1;text-align:center}
.rail i{display:block;width:18px;height:18px;border:1.6px solid currentColor;border-radius:4px}
.rail .r1{color:var(--p);font-family:var(--display);font-weight:700;font-size:15px;border:0}
.site-main{flex:1;min-width:0}
.page-hero{position:relative;overflow:hidden;background:#07050a;color:#fff;padding:34px 32px 30px;min-height:132px;display:flex;align-items:flex-end}
.page-hero svg{position:absolute;inset:0;width:100%;height:100%}
.page-hero h1{position:relative;font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:clamp(28px,3.4vw,40px);line-height:1;margin:0;letter-spacing:.01em}
.page-hero .draft{position:absolute;top:14px;right:18px}
.quicknav{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 26px}
.quicknav button{background:var(--p);color:#fff;border:0;border-radius:2px;padding:12px 16px;font-size:13.5px;font-weight:600;text-align:left;min-width:190px}
.quicknav button:hover{background:var(--p-dark)}
.quicknav-h{font-size:16px;font-weight:600;margin:0 0 10px}
.waffle{width:32px;height:32px;display:grid;place-items:center;background:none;border:0;color:#fff}
.suite .search{flex:1;max-width:460px;margin:0 auto;display:flex;align-items:center;gap:8px;background:#fff;color:#616161;border-radius:4px;height:30px;padding:0 10px;border:0;text-align:left;font-size:14px}
.suite .me{width:28px;height:28px;border-radius:50%;background:#5a5a62;display:grid;place-items:center;font-size:11px;font-weight:600;flex:none}
.sp-head{background:#fff;border-bottom:1px solid var(--line)}
.sp-head-row{display:flex;align-items:flex-start;gap:26px;padding:16px 32px 0}
.sp-logo{background:none;border:0;padding:2px 0 0;font-family:var(--display);font-weight:700;font-size:42px;line-height:1;letter-spacing:-.02em;background-image:linear-gradient(100deg,#fd005a,#e30070);-webkit-background-clip:text;background-clip:text;color:transparent;flex:none}
.sp-id{flex:1;min-width:0}
.sp-title{font-size:24px;font-weight:600;background:none;border:0;padding:0;color:var(--ink);text-align:left;line-height:1.2}
.sp-title:hover{text-decoration:underline}
.sp-utils{display:flex;gap:18px;align-items:center;font-size:13.5px;color:var(--ink);padding-top:6px;white-space:nowrap}
.sp-utils .star{color:var(--p)}
.sp-proto{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#6b5200;background:#fff4ce;border-radius:3px;padding:2px 7px}
.sp-navwrap{position:relative;margin-top:6px}
.sp-nav{display:flex;flex-wrap:nowrap;gap:24px;overflow:hidden;align-items:stretch}
.sp-top,.sp-more{flex:none;background:none;border:0;padding:6px 0 10px;font-size:15px;color:var(--ink);display:inline-flex;align-items:center;gap:6px;border-bottom:2px solid transparent;white-space:nowrap}
.sp-top:hover,.sp-more:hover,.sp-top[aria-expanded="true"],.sp-more[aria-expanded="true"]{color:var(--p)}
.sp-top.is-here{font-weight:600;border-bottom-color:var(--p)}
.sp-top svg,.sp-more svg{width:12px;height:12px;opacity:.75}
.sp-panel{position:absolute;top:100%;left:0;background:#fff;border-radius:4px;box-shadow:0 4px 18px rgba(0,0,0,.16);z-index:30;padding:24px 0 22px;max-height:70vh;overflow:auto;width:max-content;max-width:min(1040px,calc(100vw - 48px))}
.sp-cols{display:flex;flex-wrap:wrap;row-gap:20px}

.sp-grp-h{font-size:16px;font-weight:600;margin:0 0 10px;color:var(--ink)}

.sp-link:hover{color:var(--p);text-decoration:underline}

.lock .tag.part{background:#fde7f1;color:#a3004f}
.lock .tag.team{background:var(--a-soft);color:var(--a-ink)}
.lock .who{display:flex;gap:10px;align-items:flex-start;background:var(--surface-2);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--ink-2);margin-top:16px}
.tag-pill{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:var(--a-soft);color:var(--a-ink);border-radius:999px;padding:3px 10px}

.lock form{position:relative;background:#fff;color:#141416;border-radius:12px;padding:30px;width:min(440px,100%);box-shadow:0 20px 60px rgba(0,0,0,.5);border-top:5px solid #fd0074}
.lock h1{font-family:var(--display);text-transform:uppercase;font-size:34px;line-height:1;margin:0 0 10px}
.lock p{color:#4a4a52;margin:0 0 16px;font-size:14.5px}
.lock input{border:1px solid #c5c5cc;border-radius:6px;padding:10px 12px;width:100%;font-size:16px;color:#141416;background:#fff}
.lock .err{color:#c0392b;font-size:14px;margin:8px 0 0}

/* Dark hero with flowing magenta lines, echoing the D&A intranet banner */
function wavesSVG(){
  let paths = "";
  for (let i = 0; i < 26; i++) {
    const amp = 18 + i * 2.2, ph = i * 0.23, y0 = 70 + i * 5.5, pts = [];
    for (let x = 0; x <= 1200; x += 24) pts.push(x + "," + (y0 + Math.sin(x / 170 + ph) * amp + Math.sin(x / 61 + ph * 2) * 6).toFixed(1));
    const c = i % 3 === 0 ? "#fd0074" : (i % 3 === 1 ? "#9b1fb0" : "#5a1a70");
    paths += '<polyline points="' + pts.join(" ") + '" fill="none" stroke="' + c + '" stroke-width="' + (i % 5 === 0 ? 1.6 : 0.8) + '" stroke-opacity="' + (0.22 + (i % 4) * 0.1).toFixed(2) + '"/>';
  }
  return '<svg viewBox="0 0 1200 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><radialGradient id="glow" cx="70%" cy="55%" r="60%"><stop offset="0" stop-color="#6a0f72" stop-opacity=".75"/><stop offset="1" stop-color="#050206" stop-opacity="0"/></radialGradient></defs><rect width="1200" height="300" fill="url(#glow)"/>' + paths + '</svg>';
}
function statusOf(id){
  const s = P[id].status.toLowerCase();
  if (s.startsWith("existing")) return ["live","Existing page"];
  if (s.includes("confirm")) return ["tbc","URL to confirm"];
  return ["new","New page"];
}
function entries(v){
  const out = [];
  IA.versions[v].menu.forEach((m, i) => {
    if (m.link) out.push({top:i, task:null, page:m.link});
    (m.links||[]).forEach(p => out.push({top:i, task:null, page:p}));
    (m.groups||[]).forEach(g => g.links.forEach(p => out.push({top:i, task:g.task, page:p})));
  });
  return out;
}
const topHas = (v, i, pages) => entries(v).some(e => e.top === i && pages.includes(e.page));
const whereIs = (v, page) => entries(v).filter(e => e.page === page).map(e => IA.versions[v].menu[e.top].label + (e.task ? " › " + e.task : ""));

const fmtS = ms => ms == null ? "–" : (ms/1000 < 60 ? (ms/1000).toFixed(0)+"s" : Math.floor(ms/60000)+"m "+String(Math.round(ms/1000)%60).padStart(2,"0")+"s");
const median = a => { if(!a.length) return null; const s=[...a].sort((x,y)=>x-y), m=s.length>>1; return s.length%2 ? s[m] : (s[m-1]+s[m])/2; };
const pct = (n,d) => d ? Math.round(100*n/d) : null;

/* ---------- storage: shared db in the private link, nothing stored in the participant link ---------- */
const store = {
  db:null, sessions:[], mode:"local",
  async init(){
    if (MODE === "participant") return;
    this.loadLocal();
    if (!(window.claude && window.claude.use)) return;
    try {
      const db = await window.claude.use("db");
      if (!db) return;
      this.db = db; this.mode = "shared";
      db.collection("sessions").onSnapshot(snap => { this.sessions = snap.docs.map(d => d.data()).filter(Boolean); refreshLive(); },
        () => { this.db = null; this.mode = "local"; this.loadLocal(); refreshLive(); });
    } catch(e) {}
  },
  loadLocal(){ try { this.sessions = JSON.parse(localStorage.getItem("dna-sessions") || "[]"); } catch(e){ this.sessions = []; } },
  saveLocal(){ try { localStorage.setItem("dna-sessions", JSON.stringify(this.sessions)); } catch(e){} },
  async save(s){
    if (MODE === "participant") return;
    const copy = JSON.parse(JSON.stringify(s));
    const i = this.sessions.findIndex(x => x.id === s.id);
    if (i >= 0) this.sessions[i] = copy; else this.sessions.push(copy);
    if (this.db) {
      try { await this.db.doc("sessions/" + s.id).set(copy); }
      catch(e){ toast(e && e.code === "quota_exceeded" ? "Storage is full. Export results and delete old sessions." : "Couldn't save to the shared log, so it was kept on this device."); this.saveLocal(); }
    } else this.saveLocal();
  },
  async remove(id){
    this.sessions = this.sessions.filter(x => x.id !== id);
    if (this.db) { try { await this.db.doc("sessions/" + id).delete(); } catch(e){} } else this.saveLocal();
  }
};

  ex:{v:"A", page:"home", via:null}, width:"full", open:null, navFit:99, run:null, confirmDel:null, endAsk:false, madeCode:null, pErr:null };
const route = () => location.hash.replace(/^#\/?/, "").split("/");

/* ---------- overview ---------- */
function pgChip(v, id, shortcut){
  const [cls] = statusOf(id);
  const sel = S.selPage === id ? " is-sel" : "", exp = S.selTask && T[S.selTask].expected.includes(id) ? " is-exp" : "";
  return '<button class="pg' + sel + exp + (shortcut ? " shortcut" : "") + '" data-act="sel-page" data-page="' + id + '" aria-pressed="' + (S.selPage === id) + '"><span class="dot ' + cls + '"></span>' + esc(P[id].title) + '</button>';
}
function treeHTML(v){
  const ver = IA.versions[v], m = ver.menu, ents = entries(v);
  const uniq = new Set(ents.map(e => e.page)).size, tasks = m.reduce((n, x) => n + (x.groups ? x.groups.length : 0), 0);
  const seen = {}; ents.forEach(e => seen[e.page] = (seen[e.page]||0) + 1);
  const first = {}; const chip = id => { const sc = seen[id] > 1 && first[id]; first[id] = true; return pgChip(v, id, sc); };
  const rows = m.map(x => {
    let body = "";
    if (x.link) body = '<div class="pgs">' + chip(x.link) + '</div>';
    if (x.links) body = '<div class="pgs">' + x.links.map(chip).join("") + '</div>';
    if (x.groups) body = x.groups.map(g => '<div class="grp"><span class="grp-task">' + esc(g.task) + '</span><div class="pgs">' + g.links.map(chip).join("") + '</div></div>').join("");
    return '<li class="tl"><div class="tl-label">' + esc(x.label) + '</div><div class="tl-body">' + body + '</div></li>';
  }).join("");
  return '<div class="tree v' + v.toLowerCase() + '"><div class="tree-h"><span class="vtag">VERSION ' + v + '</span><h3>' + esc(ver.name) + '</h3><p>' + esc(ver.tests) + '</p>' +
    '<span class="meta">' + m.length + ' top-level · ' + (tasks ? tasks + " task prompts · 3 levels" : "2 levels") + ' · ' + uniq + ' pages</span></div><ol>' + rows + '</ol></div>';
}
function detailHTML(){
  if (!S.selPage) return '<div class="detail empty">Select any page in either menu to see where it sits in both versions, its status and its live link.</div>';
  const id = S.selPage, p = P[id], [cls, lbl] = statusOf(id), wa = whereIs("A", id), wb = whereIs("B", id);
  return '<div class="detail"><div><div class="k">Page</div><h4>' + esc(p.title) + '</h4><span class="status ' + cls + '">' + lbl + '</span><span style="font-size:13px;color:var(--ink-3)">' + esc(p.status) + '</span>' +
    (p.url ? '<div class="ext" style="margin-top:8px"><a href="' + esc(p.url) + '" target="_blank" rel="noopener">Open live page ↗</a></div>' : "") + '</div>' +
    '<div class="path a"><div class="k">In version A</div>' + wa.map(w => '<div><b>' + esc(w) + '</b></div>').join("") + '</div>' +
    '<div class="path b"><div class="k">In version B</div>' + wb.map(w => '<div><b>' + esc(w) + '</b></div>').join("") + (wb.length > 1 ? '<div style="font-size:12.5px;color:var(--ink-3)">Shortcut: one page, ' + wb.length + ' routes (R4)</div>' : "") + '</div></div>';
}
function filteredSessions(){
  return store.sessions.filter(s => (S.f.pilots || !s.pilot) && (S.f.mode === "all" || (s.mode || "live") === S.f.mode) && (S.f.who === "all" || (S.f.who === "returning" ? !!s.returning : !s.returning)));
}
function filtersHTML(){
  return '<div class="filters"><label>Sessions <select id="fl-mode" data-act="fl-mode"><option value="all"' + (S.f.mode==="all"?" selected":"") + '>Live and async</option><option value="live"' + (S.f.mode==="live"?" selected":"") + '>Live only</option><option value="async"' + (S.f.mode==="async"?" selected":"") + '>Async only</option></select></label>' +
    '<label>Participants <select id="fl-who" data-act="fl-who"><option value="all"' + (S.f.who==="all"?" selected":"") + '>All</option><option value="new"' + (S.f.who==="new"?" selected":"") + '>New to the study</option><option value="returning"' + (S.f.who==="returning"?" selected":"") + '>Returning from discovery</option></select></label>' +
    '<label><input type="checkbox" id="fl-repeat" data-act="fl-repeat"' + (S.f.repeat?" checked":"") + '> Include repeat attempts</label><label><input type="checkbox" id="fl-pilot" data-act="fl-pilot"' + (S.f.pilots?" checked":"") + '> Include pilots</label></div>';
}
function resultsHTML(){
  const ss = filteredSessions(), atts = ss.flatMap(s => s.attempts || []).filter(a => S.f.repeat || a.exposure === 1);
  const prefs = {A:0,B:0,none:0}; ss.forEach(s => { if (s.preference) prefs[s.preference]++; });
  if (!atts.length) return filtersHTML() + '<div class="tablewrap" style="margin-top:12px"><div class="empty-note">No task attempts match these filters yet. Results appear as soon as a session saves a task or an async result is imported.</div></div>';
  const cell = list => {
    if (!list.length) return '<td class="num" colspan="4" style="color:var(--ink-3)">no attempts</td>';
    const n = list.length, ok = list.filter(a => a.outcome === "success").length, fc = list.filter(a => a.firstClickCorrect).length, conf = list.filter(a => a.confidence).map(a => a.confidence), sp = pct(ok, n);
    return '<td class="num">' + n + '</td><td class="num"><span class="meter"><i><s style="width:' + sp + '%"></s></i>' + sp + '%</span></td><td class="num">' + pct(fc, n) + '%</td><td class="num">' + fmtS(median(list.map(a => a.durationMs))) + (conf.length ? ' · ' + (conf.reduce((x,y)=>x+y,0)/conf.length).toFixed(1) : "") + '</td>';
  };
  const rows = IA.tasks.map(t => '<tr><td class="tid">' + t.id + '</td>' + cell(atts.filter(a => a.taskId === t.id && a.version === "A")) + cell(atts.filter(a => a.taskId === t.id && a.version === "B")) + '</tr>').join("");
  return filtersHTML() + '<div class="tablewrap" style="margin-top:12px"><table><thead><tr><th rowspan="2">Task</th><th colspan="4" class="ga">A · Category-led</th><th colspan="4" class="gb">B · Mission-led</th></tr>' +
    '<tr><th>n</th><th>Success</th><th>1st click</th><th>Median time · conf.</th><th>n</th><th>Success</th><th>1st click</th><th>Median time · conf.</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
    '<p class="dbnote">' + ss.length + ' session' + (ss.length === 1 ? "" : "s") + ' · Preference: A ' + prefs.A + ' · B ' + prefs.B + ' · none ' + prefs.none + '. "1st click" = the first top-level item opened contained a correct page. Confidence is on a 1–5 scale. Small samples: read patterns, not percentages.</p>';
}

    '<a class="tab" href="#/"' + (active === "overview" ? ' aria-current="page"' : "") + '>Overview</a><a class="tab" href="#/explore/A">Version A</a><a class="tab" href="#/explore/B">Version B</a><a class="tab" href="#/sessions"' + (active === "sessions" ? ' aria-current="page"' : "") + '>Sessions</a>' +

    '<div class="rule"><b>Returning vs new</b>Discovery participants have seen the mission cards. Filter results to compare them with people new to the study.</div></div></section></div>';

    const del = S.confirmDel === s.id ? '<span class="endbox">Delete?<button class="btn sm" data-act="del-yes" data-id="' + s.id + '">Delete</button><button class="btn ghost sm" data-act="del-no">Keep</button></span>'
      : '<button class="btn ghost sm" data-act="del" data-id="' + s.id + '" aria-label="Delete session ' + esc(s.participant) + '">Delete</button>';
    return '<div class="srow"><span class="who">' + esc(s.participant) + '</span><div><div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center"><span class="pill ' + s.firstVersion.toLowerCase() + '">' + s.firstVersion + ' first</span><span class="pill open">' + (s.mode === "async" ? "async" : "live") + '</span>' +

    case "to-record": R.phase = "record"; render(); return;
    case "rec-start": R.s.recording = "teams"; R.s.recStartedAt = new Date().toISOString(); R.recT0 = performance.now(); R.phase = "taskcard"; R.page = "home"; render(); return;
    case "rec-fac": R.s.recording = "facilitator"; R.s.mode = "live"; R.phase = "taskcard"; R.page = "home"; render(); return;
    case "rec-none": R.s.recording = "none"; R.phase = "taskcard"; R.page = "home"; render(); return;
    case "starttask": newAttempt(); R.phase = "active"; render(); return;
    case "reread": R.phase = "reread"; render(); return;
    case "resume": R.phase = "active"; render(); return;
    case "answer": logEv("answer", R.page); R.cur.endT = performance.now(); R.phase = "confidence"; S.endAsk = false; render(); return;
    case "skip": logEv("skip", R.page); R.cur.endT = performance.now(); S.endAsk = false; finishAttempt("skip", null, ""); return;
    case "conf": { const t = T[R.cur.taskId]; finishAttempt(t.expected.includes(R.page) ? "success" : "fail", +el.dataset.n, ($("#f-tnote") || {}).value || ""); return; }
    case "stagetasks": R.phase = "taskcard"; render(); return;
    case "startexplore": R.phase = "explore"; R.page = "home"; R.via = null; render(); return;
    case "explore-done": S.endAsk = false; R.phase = "preference"; render(); return;
    case "pref": { R.pref = el.dataset.p; const why = ($("#f-why") || {}).value || ""; render(); if ($("#f-why")) $("#f-why").value = why; return; }
    case "finish": { const p = R.pref, first = R.s.firstVersion; R.s.preference = p === "0" ? "none" : (p === "1" ? first : other(first)); R.s.prefComment = ($("#f-why") || {}).value || ""; R.phase = "done"; if (MODE === "participant") { finishRemote(); return; } await store.save(R.s); render(); return; }
    case "close-session": R.s.notes = ($("#f-notes") || {}).value || ""; R.s.status = "complete"; await store.save(R.s); S.run = null; S.width = "full"; location.hash = "#/sessions"; render(); return;
    case "end-ask": S.endAsk = true; render(); return;
    case "end-no": S.endAsk = false; render(); return;
    case "end-yes": S.endAsk = false; R.s.endedEarly = true; R.phase = "done"; if (MODE === "participant") { finishRemote(); return; } store.save(R.s); render(); return;
  }
});
document.addEventListener("change", e => {
  if (!IA) return;
  const el = e.target.closest("[data-act]"); if (!el) return;
  if (el.dataset.act === "fl-mode") { S.f.mode = el.value; refreshLive(); }
  if (el.dataset.act === "fl-who") { S.f.who = el.value; refreshLive(); }
});
document.addEventListener("submit", e => e.preventDefault());
document.addEventListener("keydown", e => { if (IA && e.key === "Escape" && S.open !== null) { S.open = null; render(); } });

/* ---------- results transport: gzip + base64 text block ---------- */
function b64(bytes){ let out = ""; for (let i = 0; i < bytes.length; i += 0x8000) out += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(out); }
function unb64(str){ const bin = atob(str), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }
async function encodeSession(s){
  const json = JSON.stringify(s);
  try { if (window.CompressionStream) { const buf = await new Response(new Blob([json]).stream().pipeThrough(new CompressionStream("gzip"))).arrayBuffer(); return "DNAHUB2Z:" + b64(new Uint8Array(buf)); } } catch(e){}
  return "DNAHUB2:" + b64(new TextEncoder().encode(json));
}
async function decodeSession(text){
  const t = String(text || "").replace(/\s+/g, "");
  const m = t.match(/^DNAHUB[12](Z?):(.*)$/);
  if (!m) throw new Error("Paste the whole results block, starting with DNAHUB.");
  let json;
  if (m[1]) { if (!window.DecompressionStream) throw new Error("This browser can't read compressed results. Try Edge or Chrome."); json = await new Response(new Blob([unb64(m[2])]).stream().pipeThrough(new DecompressionStream("gzip"))).text(); }
  else json = new TextDecoder().decode(unb64(m[2]));
  const s = JSON.parse(json);
  if (!s || !s.id || !Array.isArray(s.attempts)) throw new Error("The results block is incomplete. Ask the participant to copy it again.");
  return s;
}
async function finishRemote(){
  const R = S.run; R.s.status = "complete"; R.code = null; render();
  R.code = await encodeSession(R.s); render();
  const ta = $("#f-result"); if (ta) { ta.focus(); ta.select(); }
}
async function copyFrom(sel, okMsg){
  const ta = $(sel); if (!ta) return; ta.focus(); ta.select();
  try { await navigator.clipboard.writeText(ta.value); toast(okMsg); }
  catch(e){ try { document.execCommand("copy") ? toast(okMsg) : toast("Press Ctrl+C (or Cmd+C) to copy the selected text."); } catch(_) { toast("Press Ctrl+C (or Cmd+C) to copy the selected text."); } }
}
async function importResults(){
  const box = $("#f-import"), msg = $("#import-msg");
  try {
    const s = await decodeSession(box.value);
    s.pilot = !!$("#f-import-pilot").checked; s.returning = !!$("#f-import-ret").checked; s.remote = true; s.importedAt = new Date().toISOString();
    const existed = store.sessions.some(x => x.id === s.id);
    await store.save(s); box.value = "";
    msg.textContent = (existed ? "Updated " : "Imported ") + s.participant + " (" + (s.mode === "async" ? "async" : "live") + "): " + s.attempts.length + " task" + (s.attempts.length === 1 ? "" : "s") + (s.preference ? ", prefers " + (s.preference === "none" ? "neither" : s.preference) : "") + ".";
    msg.style.color = "var(--ok)"; refreshLive();
  } catch(e) { msg.textContent = e.message || "Couldn't read that block."; msg.style.color = "var(--bad)"; }
}
function participantStartHTML(){
  return '<div class="lock">' + wavesSVG() + '<form><span class="tag part">Participant test environment</span><h1>Enter your session code</h1><p>Your code is in your invitation, or the facilitator will give it to you in the call. It looks like <span class="mono">P03-A</span>.</p>' +
    '<label class="sr" for="f-pcode">Session code</label><input type="text" id="f-pcode" autocomplete="off" spellcheck="false" class="mono" style="text-transform:uppercase;letter-spacing:.06em" placeholder="P00-A">' +
    (S.pErr ? '<p class="err" role="alert">' + esc(S.pErr) + '</p>' : "") + '<button class="btn primary" data-act="p-start" style="width:100%;justify-content:center;padding:11px;margin-top:14px">Start</button><p style="margin:14px 0 0;font-size:13px">This is a draft used for research. Nothing you do here changes any real site.</p></form></div>';
}

/* ---------- export ---------- */
async function exportCSV(){
  const cols = ["session","participant","mode","returning","pilot","design","firstVersion","preference","recording","recStartedAt","taskId","version","stage","exposure","outcome","answerPage","firstTop","firstPage","firstClickCorrect","backtracks","visited","durationSec","recOffsetSec","confidence","menuOpens","overflowOpened","bodyLinkClicks","searchClicks","taskNote","events","startedAt","prefComment","notes"];
  const q = x => { const s = String(x ?? ""); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const rows = [cols.join(",")];
  store.sessions.forEach(s => (s.attempts || []).forEach(a => rows.push([s.id, s.participant, s.mode || "live", !!s.returning, !!s.pilot, s.design, s.firstVersion, s.preference, s.recording, s.recStartedAt, a.taskId, a.version, a.stage, a.exposure, a.outcome, a.answerPage, a.firstTop, a.firstPage, a.firstClickCorrect, a.backtracks, (a.visited || []).join(" > "), (a.durationMs / 1000).toFixed(1), a.recOffsetSec, a.confidence, a.menuOpens, a.overflowOpened, a.bodyLinkClicks, a.searchClicks, a.note, (a.events || []).map(ev => ev[0] + "s " + ev[1] + ":" + ev[2]).join(" | "), a.startedAt, s.prefComment, s.notes].map(q).join(","))));
  if (rows.length === 1) { toast("Nothing to export yet."); return; }
  const csv = rows.join("\n"), name = "dna-hub-navigation-study-" + new Date().toISOString().slice(0,10) + ".csv";
  if (window.claude && window.claude.use) {
    const dl = await window.claude.use("downloads");
    if (dl) { try { await dl.save({filename:name, data:csv}); toast("Exported."); } catch(e){ if (e && e.code !== "declined") toast("Export isn't available here."); } return; }
    try { await navigator.clipboard.writeText(csv); toast("Export isn't available here, so the CSV was copied to your clipboard."); } catch(e){ toast("Export isn't available in this view."); }
    return;
  }
  const url = URL.createObjectURL(new Blob([csv], {type:"text/csv"})), aEl = document.createElement("a");
  aEl.href = url; aEl.download = name; document.body.appendChild(aEl); aEl.click(); aEl.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* ---------- boot + password gate ---------- */
function boot(d){ IA = d.IA; C = d.C; P = IA.pages; T = Object.fromEntries(IA.tasks.map(t => [t.id, t])); render(); store.init().then(refreshLive); }
async function decryptData(pw){
  const salt = unb64(ENC.salt), iv = unb64(ENC.iv), ct = unb64(ENC.ct);
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:ENC.iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv}, key, ct);
  return JSON.parse(new TextDecoder().decode(plain));
}
function lockHTML(err, busy){
  const part = MODE === "participant";
  const head = part
    ? '<span class="tag part">Participant test environment</span><h1>D&amp;A Hub navigation test</h1><p>Enter the password from your invitation to open the test. It takes about 15 minutes.</p>'
    : '<span class="tag team">Project team</span><h1>D&amp;A Hub navigation study</h1><p>The study dashboard: menu comparison, session set-up, participant codes and results. Enter the team password to open it.</p>';
  const foot = part
    ? ''
    : '';
  return '<div class="lock' + (part ? '' : ' team') + '">' + (part ? wavesSVG() : "") + '<form id="lockform">' + head +
    '<label class="sr" for="f-pw">Password</label><input type="password" id="f-pw" autocomplete="off" placeholder="Password">' + (err ? '<p class="err" role="alert">' + esc(err) + '</p>' : "") +
    '<button class="btn primary" type="submit" style="width:100%;justify-content:center;padding:11px;margin-top:14px"' + (busy ? " disabled" : "") + '>' + (busy ? "Opening…" : "Open") + '</button>' + foot + '</form></div>';
}
async function unlock(pw, remember){
  try { const d = await decryptData(pw); if (remember) ssSet("dna-pw", pw); boot(d); return true; } catch(e) { return false; }
}
function showLock(err){
  $("#app").innerHTML = lockHTML(err, false);
  const f = $("#lockform"), inp = $("#f-pw"); inp.focus();
  f.addEventListener("submit", async ev => {
    ev.preventDefault(); const pw = inp.value; if (!pw) return;
    $("#app").innerHTML = lockHTML("", true);
    if (!(await unlock(pw, true))) showLock("That password isn't right. Check it and try again.");
  });
}
(async () => {
  if (DATA) { boot(DATA); return; }
  if (!(window.crypto && crypto.subtle)) { $("#app").innerHTML = lockHTML("This browser can't open the protected prototype. Please use Edge or Chrome."); return; }
  const saved = ssGet("dna-pw");
  if (saved && await unlock(saved, false)) return;
  showLock("");
})();
